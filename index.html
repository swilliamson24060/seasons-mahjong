<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170f24">
<meta name="description" content="Mah Jong solitaire through the year: boards for the holidays and seasons you choose.">
<meta property="og:title" content="Seasons Mah Jong">
<meta property="og:description" content="Mah Jong solitaire through the year: boards for the holidays and seasons you choose, from New Year's to Christmas.">
<meta property="og:image" content="https://swilliamson24060.github.io/seasons-mahjong/icons/icon-512.png">
<meta property="og:url" content="https://swilliamson24060.github.io/seasons-mahjong/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Seasons Mah Jong</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
  <header class="bar top">
    <h1>Seasons</h1>
    <span id="where"></span>
    <span class="controls">
      <button id="menu" type="button" title="Menu: the holidays, their boards, and options"><span class="icon">☾</span><span class="label">Menu</span></button>
      <button id="pause" type="button" title="Pause: the clock stops and the board is hidden (P)"><span class="icon">⏸︎</span><span class="label">Pause</span></button>
      <button id="new" type="button" title="A new deal (N)" hidden><span class="icon">↻</span><span class="label">New deal</span></button>
      <button id="sound" type="button" title="Sound (M)"><span class="icon">🔊</span><span class="label">Sound on</span></button>
    </span>
    <button id="list" type="button" title="The shopping list: take a pair of each before checkout" hidden><span class="icon">🛒</span><span class="label">List</span><span class="things"></span><span class="checkout"></span></button>
    <button id="deals" type="button" title="Doorbusters: take a tagged pair before another shopper grabs it" hidden><span class="icon">🏷️</span><span class="label">Deals</span><span class="things"></span><span class="checkout"></span></button>
    <button id="song" type="button" title="The robin's song: take a pair of each kind in her order to sing it back" hidden><span class="icon">🐦</span><span class="label">Song</span><span class="things"></span><span class="checkout"></span></button>
    <div class="status">
      <span id="clock" hidden></span>
      <span id="souls" hidden></span>
      <span id="nap" hidden></span>
      <span id="touchdowns" title="Touchdowns: pairs taken with a tile in each end zone" hidden></span>
      <span id="lovebirds" title="Lovebirds: a kind's two pairs, taken one straight after the other" hidden></span>
      <span id="eggs" title="Eggs still to hatch: what's inside one isn't seen until it comes free" hidden></span>
      <span id="flocks" title="Birds of a feather: pairs taken whose two tiles touch" hidden></span>
      <span id="rings" title="Gold rings: rings whose every tile has been taken, turned to gold" hidden></span>
      <span id="goslings" title="Goslings in the line: pairs taken one after another, each beside or under the one before; six in a line score" hidden></span>
      <span id="swans" title="Swans: a tile and its own reflection in the lake, taken together, out of those found and still to find" hidden></span>
      <span id="milk" title="Fresh milk: pails taken while they're fresh, out of them all" hidden></span>
      <span id="dance" title="Matches until the music changes, and each free tile changes places with a tile held down" hidden></span>
      <span id="lords" title="Lords still on the board: each is free wherever he is, and one taken while held down has leapt" hidden></span>
      <span id="pipers" title="Pipers still on the board: take one, and the rest of his kind follow him out" hidden></span>
      <span id="rockets" title="Rockets still to set off: take one, and it bursts, lighting up the tiles round it" hidden></span>
      <span id="disco" title="Pairs that have danced in the spotlight: both their tiles in the disco ball's beam" hidden></span>
      <span id="balloons" title="Balloons to pop, and the matches until the net opens again and the balloons left float away" hidden></span>
      <span id="coin" title="How close your last pair came to the lucky coin: hot, a tile away or less, warm, three or less, or cold" hidden></span>
      <span id="sparklers" title="Sparklers still to take: each lights as its tile comes free, and burns down over five matches" hidden></span>
      <span id="confetti" title="Perfect matches: two tiles of a kind that caught the same colour of confetti, taken together" hidden></span>
      <span id="stars" title="Wishes made, and the matches until the next shooting star" hidden></span>
      <span id="glasses" title="Places still between the two glasses: each glides one on with every match, unless a tile is in its way, and they clink when they meet" hidden></span>
      <span id="resolution" title="Days of January your resolution has held, a match each: take a sweet before February and it's broken" hidden></span>
      <span id="arrows" title="Couples taken together, love at first sight: the two tiles Cupid's arrow strikes, taken before his next flies" hidden></span>
      <span id="messages" title="Sweet nothings said, of the secret admirer's messages: the pair with one half, and straight after it the pair with the other" hidden></span>
      <span id="roses" title="Roses in the bouquet, of the dozen: each taken while it's in bloom, with any tile of its kind" hidden></span>
      <span id="candles" title="Candlelit pairs, a tile in each candle's glow; and the matches until the candles burn down and their glow sinks a row" hidden></span>
      <span id="chocolates" title="Chocolates savoured, of the nine: each eaten whole, cup and all, before biting into another" hidden></span>
      <span id="kisses" title="XOXOs made, kisses from the X and hugs from the O taken in turn, four in a row; and the run so far" hidden></span>
      <span id="raindrops" title="Raindrops caught, each by taking the tile it's on; and the matches until the next lands on the umbrella's peak" hidden></span>
      <span id="splashes" title="Splashes in a row, pairs from the puddle taken one straight after another; and what the next splash would score" hidden></span>
      <span id="colours" title="Colours caught, pairs from the band of the rainbow lit as they were taken; and the band lit now, and the band lit next" hidden></span>
      <span id="blooms" title="Blooms picked, of the seedlings in the tray: each watered three times by pairs taken beside it, then taken" hidden></span>
      <span id="can" title="How full the watering can is, of the five measures it holds, filled by pairs from its body; and its pours, pairs of its drops taken with water in it" hidden></span>
      <span id="honey" title="Honey made, the tulip the bee is on taken, of the tulips in the bed" hidden></span>
      <span id="snow" title="Snow knocked off tiles, and the matches until the next snowball" hidden></span>
      <span id="equinox" title="Equinox pairs: a tile from the day side, on the left, and one from the night side, on the right, taken together" hidden></span>
      <span id="sweep" title="Rows swept clean from the top down, of all the rows; and the tiles left in the row to sweep next, marked on the board" hidden></span>
      <span id="clover" title="Four-leaf clovers found; and, while one shows, the matches it keeps for: take its tile with a tile of its kind before it blows away" hidden></span>
      <span id="wind" title="Pairs that caught the wind, a tile of each on the edge the wind blows on; where the wind blows from, the tiles on that edge loose; and the matches until it turns" hidden></span>
      <span id="tide" title="The rows the tide covers from the bottom, their tiles not to be taken, and whether it's coming in or going out; and the matches until it moves a row" hidden></span>
      <span id="crab" title="Sand crabs sent back into their burrows by a pair right beside them; and while one is in its burrow, the matches until the next comes out" hidden></span>
      <span id="waves" title="The waves rolled in, each turning the tiles along the foot of the board round a place; and the matches until the next" hidden></span>
      <span id="left"></span>
      <span id="score" title="Score"></span>
      <span id="time"></span>
    </div>
  </header>
  <main id="table"><div id="board" aria-label="The board"></div></main>
  <footer class="bar bottom">
    <button id="undo" type="button" title="Undo (U)"><span class="icon">↶</span><span class="label">Undo</span></button>
    <button id="hint" type="button"><span class="icon">🔮</span><span class="label">Hint</span></button>
    <button id="shuffle" type="button"><span class="icon">🔀</span><span class="label">Shuffle</span></button>
    <button id="moon" type="button" title="Hold to see the night side (or hold Space)"><span class="icon">🌙</span><span class="label">Peek</span></button>
    <span class="treats">
      <button id="candle" type="button" title="A candle shows you a match, for free"><span class="icon">🕯️<b class="count">0</b></span><span class="label">Free hint</span></button>
      <button id="key" type="button" title="A skeleton key frees one blocked tile"><span class="icon">🗝️<b class="count">0</b></span><span class="label">Unlock</span></button>
      <button id="cat" type="button" title="A black cat shuffles the tiles for free"><span class="icon">🐈‍⬛<b class="count">0</b></span><span class="label">Free shuffle</span></button>
    </span>
    <span class="fridge" id="fridge" title="The fridge: tap a free tile, then a container, to save it for later" hidden><span class="slots"></span><span class="label">Fridge</span></span>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="card" hidden>
    <div class="inner" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <h2 id="card-title"></h2>
      <div id="card-figure" hidden></div>
      <p id="card-text"></p>
      <input id="card-input" type="text" maxlength="16" autocomplete="nickname" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Your name" hidden>
      <table class="score" id="card-score" hidden></table>
      <div class="hours" id="card-grid" hidden></div>
      <table class="ranks" id="card-ranks" hidden></table>
      <div class="actions" id="card-actions"></div>
      <div class="options" id="card-options" hidden>
        <label><input type="checkbox" id="magnify"> 🔍 Hold a tile to see it up close</label>
        <label><input type="checkbox" id="dim"> 🔅 Dim the blocked tiles</label>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
